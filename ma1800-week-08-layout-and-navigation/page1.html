<html> 

<head> 


    
<style> 

body { 

    background: linear-gradient(-45deg, blue, skyblue, azure, pink); 

    height: 100vh; 
    display: grid; 
    place-items: center;
    margin: 0; 
}

.line {

width: 500px;
height: 50px;


background: linear-gradient(-45deg, indigo, palegreen);


animation: move 1s infinite alternate; 

}

@keyframes move { 

from {transform: rotate(0deg);}

to {transform: rotate(360deg);}




}

</style>


</head>

</body>



</html>
